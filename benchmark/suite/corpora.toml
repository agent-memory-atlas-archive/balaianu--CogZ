# Benchmark corpus manifest — every corpus is a public, pinned checkout.
# `github` corpora are fetched by `fetch_corpus.py` into a corpora dir,
# resolved from $COGZ_BENCH_CORPORA (default: `corpora_dir` below, relative
# to benchmark/). `local` entries resolve `path` relative to this directory —
# use them only for the project's own repository.

[suite]
corpora_dir = "corpora"
results_dir = "results/suite"
config_template = "config_template.toml"

[[corpus]]
name = "httpx"
source = "github"
url = "https://github.com/encode/httpx"
sha = "b5addb64f0161ff6bfe94c124ef76f6a1fba5254"
language = "python"

[[corpus]]
name = "clap"
source = "github"
url = "https://github.com/clap-rs/clap"
sha = "8ab46fe22b4aa5c3bd09cc0e6c3fe9a75fc178a8"
language = "rust"

[[corpus]]
name = "cobra"
source = "github"
url = "https://github.com/spf13/cobra"
sha = "adbc8813901bba65827259daa8e22ff94ec1f30e"
language = "go"

# The project benchmarks against its own repository — `.cogz/` is the live
# dogfooding corpus. `path` resolves relative to this directory.
[[corpus]]
name = "cogz"
source = "local"
path = "../.."
language = "rust"
